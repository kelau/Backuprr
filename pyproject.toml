[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backuprr"
version = "0.2.54"
description = "Catalog and back up hierarchical media libraries to Usenet."
requires-python = ">=3.9"
readme = "README.md"
authors = [{name = "Backuprr"}]
license = {text = "MIT"}
dependencies = []

[project.scripts]
backuprr = "backuprr.cli:main"

[tool.setuptools.packages.find]
include = ["backuprr*"]
