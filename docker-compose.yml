services:
  backuprr:
    build: .
    container_name: backuprr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BACKUPRR_CONFIG: /data/config.json
    volumes:
      - ./data:/data
      - /srv/media:/media:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
